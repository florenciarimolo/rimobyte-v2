name: Blog draft PR

on:
  schedule:
    # Todos los días 08:00 UTC — crea borrador si scheduledDate <= hoy
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Adelantar el siguiente post aunque no haya llegado su fecha'
        required: false
        default: 'false'
        type: boolean
      slug:
        description: 'Slug concreto del calendario (opcional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crear borrador, recordatorio o skip
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BLOG_NOTIFY_TO: ${{ secrets.BLOG_NOTIFY_TO }}
          SEO_REPORT_TO: ${{ secrets.SEO_REPORT_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="$ARGS --slug=${{ inputs.slug }}"
          fi
          node scripts/draft-next-blog-post.mjs $ARGS
