name: Blog PR preview notify

# Aviso por email cuando hay un PR de blog con preview de Vercel listo.
on:
  pull_request:
    types: [opened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número de PR (p. ej. 1) para reenviar aviso'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'blog/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Metadatos del PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          REPO="${{ github.repository }}"
          DATA=$(gh api "repos/$REPO/pulls/$PR")
          HEAD=$(echo "$DATA" | jq -r '.head.ref')
          URL=$(echo "$DATA" | jq -r '.html_url')
          TITLE=$(echo "$DATA" | jq -r '.title')
          SLUG="${HEAD#blog/}"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "pr_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Título y fecha desde calendario (rama del PR)
        id: calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.pr.outputs.slug }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          REPO="${{ github.repository }}"
          B64=$(gh api "repos/$REPO/contents/content/blog-calendar.json?ref=$HEAD" --jq -r '.content' 2>/dev/null || echo "")
          if [ -z "$B64" ] || [ "$B64" = "null" ]; then
            echo "title=" >> "$GITHUB_OUTPUT"
            echo "scheduled=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$B64" | base64 -d > /tmp/calendar.json
          node -e "
          const fs = require('fs');
          const slug = process.env.SLUG;
          const cal = JSON.parse(fs.readFileSync('/tmp/calendar.json', 'utf8'));
          const post = cal.posts.find((p) => p.slug === slug) || {};
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + (post.title || '') + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'scheduled=' + (post.scheduledDate || '') + '\n');
          "

      - name: Obtener preview de Vercel
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MAX_TIMEOUT_MS: 600000
        run: node scripts/get-vercel-preview-url.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enviar email de revisión
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BLOG_NOTIFY_TO: ${{ secrets.BLOG_NOTIFY_TO }}
          SEO_REPORT_TO: ${{ secrets.SEO_REPORT_TO }}
          PR_URL: ${{ steps.pr.outputs.url }}
          POST_SLUG: ${{ steps.pr.outputs.slug }}
          POST_TITLE: ${{ steps.calendar.outputs.title || steps.pr.outputs.pr_title }}
          SCHEDULED_DATE: ${{ steps.calendar.outputs.scheduled }}
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
        run: node scripts/notify-blog-pr-email.mjs
